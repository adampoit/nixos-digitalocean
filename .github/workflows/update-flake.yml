name: Update flake inputs

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - id: not-adam
        uses: adampoit/not-adam@v1
        with:
          private-key: ${{ secrets.NOT_ADAM_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.not-adam.outputs.token }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: |
          cp flake.lock /tmp/flake.lock.before
          nix flake update

      - name: Build pull request body
        run: |
          node <<'EOF' > /tmp/pr_body.txt
          const fs = require('fs');

          const before = JSON.parse(fs.readFileSync('/tmp/flake.lock.before', 'utf8')).nodes;
          const after = JSON.parse(fs.readFileSync('flake.lock', 'utf8')).nodes;

          const format = locked => {
            if (!locked) return '';
            if (locked.type === 'github' && locked.owner && locked.repo && locked.rev) {
              const shortRev = locked.rev.slice(0, 12);
              return `[${locked.owner}/${locked.repo}@${shortRev}](https://github.com/${locked.owner}/${locked.repo}/commit/${locked.rev})`;
            }
            if (locked.rev) return `\`${locked.rev.slice(0, 12)}\``;
            if (locked.url) return locked.url;
            return JSON.stringify(locked);
          };

          const changed = Object.keys(after)
            .filter(name => JSON.stringify(before[name]?.locked) !== JSON.stringify(after[name]?.locked))
            .sort();

          console.log('## Updated flake inputs');
          console.log();
          console.log('This automated PR updates `flake.lock`.');
          console.log();

          if (changed.length === 0) {
            console.log('No flake inputs changed.');
          } else {
            console.log('| Input | Before | After |');
            console.log('| --- | --- | --- |');
            for (const name of changed) {
              console.log(`| \`${name}\` | ${format(before[name]?.locked)} | ${format(after[name]?.locked)} |`);
            }
          }
          EOF

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.not-adam.outputs.token }}
          branch: update/flake-inputs
          title: "chore: update flake inputs"
          body-path: /tmp/pr_body.txt
          commit-message: "chore: update flake inputs"
          delete-branch: true
          labels: dependencies, automated

      - name: Enable auto-merge
        if: ${{ steps.create-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ steps.not-adam.outputs.token }}
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
