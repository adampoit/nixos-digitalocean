name: Update flake inputs

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: |
          nix flake update
          echo "Changes:" | tee /tmp/pr_body.txt
          git diff flake.lock | head -100 | tee -a /tmp/pr_body.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/flake-inputs
          title: "chore: update flake inputs"
          body-path: /tmp/pr_body.txt
          commit-message: "chore: update flake inputs"
          delete-branch: true
          labels: dependencies, automated
