name: Build, Test on DO, and Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build image
        run: nix build .#packages.x86_64-linux.digitalocean-image

      - name: Show image info
        run: |
          ls -lh result/
          file result/*

      - name: Upload image artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: digitalocean-image
          path: result/*.qcow2.gz
          retention-days: 1

  test-fresh-boot:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: digitalocean-image
          path: ./artifacts

      - name: Create draft release with artifact
        run: |
          cd artifacts
          ARTIFACT=$(ls *.qcow2.gz | head -1)
          mv "$ARTIFACT" "nixos-digitalocean-base-${GITHUB_REF_NAME}.qcow2.gz"
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release — validating on DigitalOcean" \
            "nixos-digitalocean-base-${GITHUB_REF_NAME}.qcow2.gz"
          echo "ARTIFACT_NAME=nixos-digitalocean-base-${GITHUB_REF_NAME}.qcow2.gz" >> "$GITHUB_ENV"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/do_test_key -N "" -C "github-actions-test"

      - name: Upload SSH key to DigitalOcean
        run: |
          KEY_NAME="gh-actions-test-$(date +%s)"
          doctl compute ssh-key create "$KEY_NAME" \
            --public-key "$(cat /tmp/do_test_key.pub)" \
            --format ID \
            --no-header > /tmp/ssh_key_id
          echo "SSH_KEY_ID=$(cat /tmp/ssh_key_id)" >> "$GITHUB_ENV"
          echo "SSH_KEY_NAME=$KEY_NAME" >> "$GITHUB_ENV"

      - name: Import image to DigitalOcean
        run: |
          IMAGE_NAME="nixos-do-base-${GITHUB_REF_NAME}"
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ARTIFACT_NAME}"
          doctl compute image create "$IMAGE_NAME" \
            --region sfo3 \
            --image-distribution Unknown \
            --image-url "$IMAGE_URL" \
            --tag-names nixos-test,github-actions

      - name: Wait for image to become available
        run: |
          IMAGE_NAME="nixos-do-base-${GITHUB_REF_NAME}"
          for i in $(seq 1 60); do
            STATUS=$(doctl compute image list-user --output json | \
              jq -r ".[] | select(.name == \"$IMAGE_NAME\") | .status")
            if [ "$STATUS" = "available" ]; then
              echo "Image is available"
              IMAGE_ID=$(doctl compute image list-user --output json | \
                jq -r ".[] | select(.name == \"$IMAGE_NAME\") | .id")
              echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Image status: $STATUS (attempt $i/60, waiting 30s)"
            sleep 30
          done
          echo "Error: Image did not become available within 30 minutes"
          exit 1

      - name: Create test droplet
        run: |
          DROPLET_NAME="nixos-test-${GITHUB_REF_NAME}"
          doctl compute droplet create "$DROPLET_NAME" \
            --region sfo3 \
            --size s-1vcpu-1gb \
            --image "$IMAGE_ID" \
            --ssh-keys "$SSH_KEY_ID" \
            --tag-names nixos-test,github-actions \
            --wait \
            --format ID,PublicIPv4 \
            --no-header > /tmp/droplet_info
          DROPLET_ID=$(awk '{print $1}' /tmp/droplet_info)
          DROPLET_IP=$(awk '{print $2}' /tmp/droplet_info)
          echo "DROPLET_ID=$DROPLET_ID" >> "$GITHUB_ENV"
          echo "DROPLET_IP=$DROPLET_IP" >> "$GITHUB_ENV"
          echo "Created droplet $DROPLET_NAME (ID: $DROPLET_ID, IP: $DROPLET_IP)"

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i /tmp/do_test_key \
                   root@"$DROPLET_IP" 'echo ssh-ready' 2>/dev/null; then
              echo "SSH is ready after $((i * 10)) seconds"
              exit 0
            fi
            sleep 10
          done
          echo "Error: SSH did not become available within 5 minutes"
          exit 1

      - name: Verify system health
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -i /tmp/do_test_key \
              root@"$DROPLET_IP" '
                set -e
                echo "=== Kernel ==="
                uname -a
                echo "=== NixOS Version ==="
                nixos-version
                echo "=== SSH Status ==="
                systemctl is-active sshd.service
                echo "=== DO Agent Status ==="
                systemctl is-active do-agent.service || true
                echo "=== Disk Usage ==="
                df -h /
                echo "=== Nix Store ==="
                nix --version
                echo "=== All checks passed ==="
              '

      - name: Cleanup droplet
        if: always()
        run: |
          if [ -n "$DROPLET_ID" ]; then
            echo "Deleting droplet $DROPLET_ID..."
            doctl compute droplet delete "$DROPLET_ID" --force || true
          fi

      - name: Cleanup SSH key
        if: always()
        run: |
          if [ -n "$SSH_KEY_ID" ]; then
            echo "Deleting SSH key $SSH_KEY_NAME (ID: $SSH_KEY_ID)..."
            doctl compute ssh-key delete "$SSH_KEY_ID" --force || true
          fi

      - name: Cleanup imported image
        if: always()
        run: |
          if [ -n "$IMAGE_ID" ]; then
            echo "Deleting imported image $IMAGE_ID..."
            doctl compute image delete "$IMAGE_ID" --force || true
          fi

      - name: Delete draft release on failure
        if: failure()
        run: |
          echo "Tests failed. Deleting draft release ${GITHUB_REF_NAME}..."
          gh release delete "${GITHUB_REF_NAME}" --yes || true

  test-upgrade:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Skipping upgrade test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: $PREV_TAG"
            echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.prev_tag.outputs.skip == 'false'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install doctl
        if: steps.prev_tag.outputs.skip == 'false'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Generate temporary SSH key
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          ssh-keygen -t ed25519 -f /tmp/do_test_key -N "" -C "github-actions-test"

      - name: Upload SSH key to DigitalOcean
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          KEY_NAME="gh-actions-test-$(date +%s)"
          doctl compute ssh-key create "$KEY_NAME" \
            --public-key "$(cat /tmp/do_test_key.pub)" \
            --format ID \
            --no-header > /tmp/ssh_key_id
          echo "SSH_KEY_ID=$(cat /tmp/ssh_key_id)" >> "$GITHUB_ENV"
          echo "SSH_KEY_NAME=$KEY_NAME" >> "$GITHUB_ENV"

      - name: Import previous release image to DigitalOcean
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          IMAGE_NAME="nixos-do-base-upgrade-${GITHUB_REF_NAME}"
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/${PREV_TAG}/nixos-digitalocean-base-${PREV_TAG}.qcow2.gz"
          doctl compute image create "$IMAGE_NAME" \
            --region sfo3 \
            --image-distribution Unknown \
            --image-url "$IMAGE_URL" \
            --tag-names nixos-test,github-actions,upgrade-test

      - name: Wait for image to become available
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          IMAGE_NAME="nixos-do-base-upgrade-${GITHUB_REF_NAME}"
          for i in $(seq 1 60); do
            STATUS=$(doctl compute image list-user --output json | \
              jq -r ".[] | select(.name == \"$IMAGE_NAME\") | .status")
            if [ "$STATUS" = "available" ]; then
              echo "Image is available"
              IMAGE_ID=$(doctl compute image list-user --output json | \
                jq -r ".[] | select(.name == \"$IMAGE_NAME\") | .id")
              echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Image status: $STATUS (attempt $i/60, waiting 30s)"
            sleep 30
          done
          echo "Error: Image did not become available within 30 minutes"
          exit 1

      - name: Create test droplet from old image
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          DROPLET_NAME="nixos-upgrade-test-${GITHUB_REF_NAME}"
          doctl compute droplet create "$DROPLET_NAME" \
            --region sfo3 \
            --size s-1vcpu-1gb \
            --image "$IMAGE_ID" \
            --ssh-keys "$SSH_KEY_ID" \
            --tag-names nixos-test,github-actions,upgrade-test \
            --wait \
            --format ID,PublicIPv4 \
            --no-header > /tmp/droplet_info
          DROPLET_ID=$(awk '{print $1}' /tmp/droplet_info)
          DROPLET_IP=$(awk '{print $2}' /tmp/droplet_info)
          echo "DROPLET_ID=$DROPLET_ID" >> "$GITHUB_ENV"
          echo "DROPLET_IP=$DROPLET_IP" >> "$GITHUB_ENV"
          echo "Created droplet $DROPLET_NAME (ID: $DROPLET_ID, IP: $DROPLET_IP)"

      - name: Wait for SSH
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i /tmp/do_test_key \
                   root@"$DROPLET_IP" 'echo ssh-ready' 2>/dev/null; then
              echo "SSH is ready after $((i * 10)) seconds"
              exit 0
            fi
            sleep 10
          done
          echo "Error: SSH did not become available within 5 minutes"
          exit 1

      - name: Set up SSH config for deploy-rs
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host test-droplet
            HostName $DROPLET_IP
            User root
            IdentityFile /tmp/do_test_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy current flake via deploy-rs
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          echo "Deploying current flake to test droplet..."
          nix run .#deploy-rs -- .#test-droplet

      - name: Verify system health after deploy
        if: steps.prev_tag.outputs.skip == 'false'
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -i /tmp/do_test_key \
              root@"$DROPLET_IP" '
                set -e
                echo "=== Kernel ==="
                uname -a
                echo "=== NixOS Version ==="
                nixos-version
                echo "=== SSH Status ==="
                systemctl is-active sshd.service
                echo "=== DO Agent Status ==="
                systemctl is-active do-agent.service || true
                echo "=== Disk Usage ==="
                df -h /
                echo "=== Nix Store ==="
                nix --version
                echo "=== All checks passed ==="
              '

      - name: Cleanup droplet
        if: always() && steps.prev_tag.outputs.skip == 'false'
        run: |
          if [ -n "$DROPLET_ID" ]; then
            echo "Deleting droplet $DROPLET_ID..."
            doctl compute droplet delete "$DROPLET_ID" --force || true
          fi

      - name: Cleanup SSH key
        if: always() && steps.prev_tag.outputs.skip == 'false'
        run: |
          if [ -n "$SSH_KEY_ID" ]; then
            echo "Deleting SSH key $SSH_KEY_NAME (ID: $SSH_KEY_ID)..."
            doctl compute ssh-key delete "$SSH_KEY_ID" --force || true
          fi

      - name: Cleanup imported image
        if: always() && steps.prev_tag.outputs.skip == 'false'
        run: |
          if [ -n "$IMAGE_ID" ]; then
            echo "Deleting imported image $IMAGE_ID..."
            doctl compute image delete "$IMAGE_ID" --force || true
          fi

  release:
    needs: [test-fresh-boot, test-upgrade]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: digitalocean-image
          path: ./artifacts

      - name: Publish release
        run: |
          echo "Publishing release ${GITHUB_REF_NAME}..."
          gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Compute checksum and upload to release
        run: |
          cd artifacts
          ARTIFACT=$(ls *.qcow2.gz | head -1)
          mv "$ARTIFACT" "nixos-digitalocean-base-${GITHUB_REF_NAME}.qcow2.gz"
          sha256sum "nixos-digitalocean-base-${GITHUB_REF_NAME}.qcow2.gz" > "nixos-digitalocean-base-${GITHUB_REF_NAME}.sha256"
          gh release upload "${GITHUB_REF_NAME}" "nixos-digitalocean-base-${GITHUB_REF_NAME}.sha256"
